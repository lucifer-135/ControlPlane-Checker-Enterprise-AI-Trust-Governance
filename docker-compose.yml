services:
  controlplane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controlplane-checker
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Signs the audit chain; no default, since a published key lets anyone forge records
      - AUDIT_HMAC_SECRET=${AUDIT_HMAC_SECRET:?Set AUDIT_HMAC_SECRET in .env (e.g. openssl rand -hex 32)}
      # Production requires API keys; this registers the first admin key at startup
      - CONTROLPLANE_BOOTSTRAP_ADMIN_KEY=${CONTROLPLANE_BOOTSTRAP_ADMIN_KEY:-}
    volumes:
      - ./data:/app/data
      - ./policies:/app/policies
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

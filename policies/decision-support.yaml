apiVersion: governance.controlplane.io/v1alpha1
kind: PolicyProfile
metadata:
  name: decision_support
  title: 'Regulated Decision Support Profile'
  version: '3.1.0-strict'
  description: 'Highest regulatory scrutiny (FINRA, ECOA, HIPAA). Pre-response blocking enabled for high-risk credit, loan, and insurance triage.'
spec:
  jurisdiction: US_HIPAA_FINRA
  enactment:
    default_mode: FAIL_CLOSED
    max_pipeline_latency_budget_ms: 400
    timeout_fallback: BLOCK
  lanes:
    performance:
      min_groundedness: 0.70
      confidently_wrong_action: BLOCK
    responsibility:
      pii_severity_cutoff: 0.15
      toxicity_cutoff: 0.25
    cost:
      token_z_score_cutoff: 3.0
  weights:
    performance: 0.50
    cost: 0.10
    responsibility: 0.40
  thresholds:
    block_escalate: 0.55
    soft_correct: 0.35
    badge: 0.18
